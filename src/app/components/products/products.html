<section class="industrial-products">
    <div class="container">

        <!-- Top Header Row -->
        <div class="section-top">
            <div class="header-content">
                <div class="subtitle">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                    </svg>
                    <span>أفضل الخدمات</span>
                </div>
                <h2 class="title">احصل على أفضل الخدمات الصناعية لأعمالك</h2>
            </div>
        </div>

        <!-- Slider Track -->
        <div class="slider-viewport" #sliderTrack [class.is-visible]="isVisible">
            <div class="cards-wrapper">
                <!-- Data set 1 for infinite scroll -->
                <div class="product-card" *ngFor="let p of productsList">
                    <div class="card-image">
                        <img [src]="p.image" [alt]="p.title">
                    </div>
                    <div class="card-body">
                        <h3 class="card-title">{{ p.title }}</h3>
                        <p class="card-desc">{{ p.description }}</p>
                        <div class="card-footer">
                            <div class="footer-bottom-row">
                                <div class="number-bg">{{ p.id }}</div>
                                <div class="divider-line"></div>
                            </div>
                            <div class="action-area">
                                <span class="view-text">عرض التفاصيل</span>
                                <div class="arrow-box">
                                    <span class="arrow-char">→</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Data set 2, duplicated for infinite scroll -->
                <div class="product-card" *ngFor="let p of productsList" aria-hidden="true">
                    <div class="card-image">
                        <img [src]="p.image" [alt]="p.title">
                    </div>
                    <div class="card-body">
                        <h3 class="card-title">{{ p.title }}</h3>
                        <p class="card-desc">{{ p.description }}</p>
                        <div class="card-footer">
                            <div class="footer-bottom-row">
                                <div class="number-bg">{{ p.id }}</div>
                                <div class="divider-line"></div>
                            </div>
                            <div class="action-area">
                                <span class="view-text">عرض التفاصيل</span>
                                <div class="arrow-box">
                                    <span class="arrow-char">→</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </div>
</section>
