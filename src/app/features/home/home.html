<section class="minimal-about-section">
  <div class="container">

    <div class="about-top-wrapper">

      <div class="badge-area">
        <img src="/images/logo croped.png" alt="service icon">
        <span>عن شركتنا</span>
      </div>

      <div class="text-area">
        <h2 class="main-heading">نستند إلى خبراتنا لتقديم <br> حلول صناعية <span class="gold-text">استثنائية</span></h2>

        <p class="desc-text">
          تأسست شركة هايدرو للصناعات عام 1999 بهدف تقديم حلول صناعية متكاملة في مجال كماليات أنظمة الألومنيوم. تتميز
          الشركة بتقديم منتجات عالية الجودة وفقاً للمعايير الدولية، وتعد واحدة من الرواد في السوق المحلي والعربي.
        </p>

        <p class="desc-text" style="margin-top: 15px;">
          في عام 2020 أنشأت الشركة مصنعاً متخصصاً لتقديم أفضل الحلول الإنتاجية، وبدأت بالفعل الإنتاج عام 2021، وتميزت
          بتوسيع خطوط الإنتاج لتلبية احتياجات العملاء. تعمل الشركة على تطوير خبراتها باستمرار لضمان جودة التصنيع ومواكبة
          التطورات في التصميم المعماري الحديث.
        </p>
      </div>

      <div class="action-area">
        <a routerLink="/about" class="about-btn">
          اكتشف المزيد
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </a>
      </div>

    </div>

    <div class="about-stats-row" #statsSection>
      <div class="stat-box" *ngFor="let stat of stats">
        <span class="stat-num">
          +{{ stat.currentText }}
        </span>
        <span class="stat-label">{{ stat.label }}</span>
      </div>
    </div>
  </div>
</section>
